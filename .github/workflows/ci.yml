name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install dependencies
        run: python -m pip install pillow pystray curl_cffi
      - name: Run unit tests
        run: python -m unittest discover tests

  linux-packages:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - name: Build .deb, AppImage and tar.gz (Debian 11 container)
        run: |
          mkdir -p dist-linux
          docker build -f packaging/linux/Dockerfile.build -t cut-build .
          docker run --rm -e PYTHONDONTWRITEBYTECODE=1 -v "$PWD":/src -v "$PWD/dist-linux":/out cut-build
      - name: Smoke test on several distributions
        run: |
          for image in ubuntu:22.04 ubuntu:24.04 debian:12 fedora:41 archlinux:latest; do
            docker run --rm -v "$PWD":/src:ro -v "$PWD/dist-linux":/pkg:ro "$image" bash /src/tests/linux/distro_smoke.sh
          done
      - name: GUI integration tests (tray host, notifications, keyring)
        run: |
          docker build -f tests/linux/Dockerfile.snixembed -t cut-snixembed-build .
          docker build -f tests/linux/Dockerfile.ubuntu -t cut-test:ubuntu2404 .
          mkdir -p tests/linux/out
          docker run --rm -v "$PWD":/src:ro -v "$PWD/dist-linux":/pkg:ro -v "$PWD/tests/linux/out":/out \
            cut-test:ubuntu2404 bash /src/tests/linux/frozen_gui.sh sni xembed nowatch nobus firstrun
          docker run --rm -v "$PWD":/src:ro cut-test:ubuntu2404 bash /src/tests/linux/keyring_test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist-linux/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-test-screenshots
          path: tests/linux/out/*.png
